name: Daily JobTread Scrub

on:
  # PAUSED: the daily schedule is commented out while this repo is public,
  # so real client/job data can't get pushed to a public page. Once the
  # repo is private (paid GitHub plan) or you've moved hosting elsewhere,
  # uncomment the two lines below to resume the automatic daily run.
  # schedule:
  #   - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate report
        env:
          JOBTREAD_GRANT_KEY: ${{ secrets.JOBTREAD_GRANT_KEY }}
        run: python3 scripts/generate_scrub.py

      - name: Commit and push updated report
        run: |
          git config user.name "daily-scrub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/history.json
          git diff --quiet --cached || git commit -m "Daily scrub: $(date -u +'%Y-%m-%d')"
          git push
